name: cadastro-ativos
services:
  web:
    image: ${ATIVOS_IMAGE:?Defina ATIVOS_IMAGE}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ativos_data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  ativos_data:
    external: true
    name: cadastro-ativos_ativos_data
