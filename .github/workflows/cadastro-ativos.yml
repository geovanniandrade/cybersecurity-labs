name: Cadastro de Ativos - DevSecOps
on:
  push:
    branches: [feat/cadastro-ativos]
    paths: ['devsecops/cadastro-ativos/**', '.github/workflows/cadastro-ativos.yml']
  pull_request:
    paths: ['devsecops/cadastro-ativos/**', '.github/workflows/cadastro-ativos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ativos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: devsecops/cadastro-ativos
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar dependencias e ferramentas
        run: |
          python -m pip install -r requirements.lock
          python -m pip install bandit==1.9.4 pip-audit==2.10.1
          mkdir -p reports
          python -m pip freeze > reports/dependencies.txt
      - name: Testes automatizados
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee reports/tests.txt
      - name: Bandit - analisar codigo
        if: ${{ !cancelled() }}
        run: bandit app.py -f json -o reports/bandit.json
      - name: pip-audit - analisar dependencias
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements.lock -f json -o reports/pip-audit.json
      - name: Guardar evidencias
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidencias-${{ github.sha }}
          path: devsecops/cadastro-ativos/reports/
          retention-days: 30
  imagem:
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Construir imagem
        env:
          COMMIT: ${{ github.sha }}
        run: |
          docker build --pull --label "org.opencontainers.image.revision=$COMMIT" \
            -t ativos-ci devsecops/cadastro-ativos
      - name: Testar container
        run: |
          docker run -d --name ativos-check -p 127.0.0.1:18080:8080 ativos-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then exit 0; fi
            sleep 2
          done
          docker logs ativos-check
          exit 1
      - name: Publicar somente versao aprovada da branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/cadastro-ativos'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          image=ghcr.io/geovanniandrade/cadastro-ativos
          docker tag ativos-ci "$image:sha-$COMMIT"
          docker push "$image:sha-$COMMIT"
          docker tag ativos-ci "$image:approved"
          docker push "$image:approved"
          echo "Imagem aprovada: $image:sha-$COMMIT" >> "$GITHUB_STEP_SUMMARY"
      - name: Limpar container de teste
        if: always()
        run: docker rm -f ativos-check || true
